name: Build REDMI K30 picasso (MIUI 13 A12)

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME : "xiaomi_redmi_k30_picasso"
  DEVICE_CODENAME : "picasso"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : "CONFIG_COMPAT=y CONFIG_COMPAT_32BIT_TIME=y"

  KERNEL_SOURCE : "https://github.com/Kiz9178/android_kernel_xiaomi_sm7250.git"
  KERNEL_BRANCH : "16-susfs-miui"

  # 使用 GCC（对旧内核更友好）
  GCC_GNU: true
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "android12L-release"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "android12L-release"

  # 清空 Clang 相关
  CLANG_SOURCE: ""
  CLANG_BRANCH: ""

  DEFCONFIG_NAME : "vendor/xiaomi/picasso.config"

  KERNELSU_SOURCE : "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/refs/heads/main/kernel/setup.sh"
  KERNELSU_BRANCH : "v4.1.0"
  KERNELSU_AUTO_GET : "true"
  KERNELSU_AUTO_FORK : "resukisu"

  SUSFS_ENABLE : true
  SUSFS_FIXED : true
  SUSFS_UPDATE : true

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  NEED_DTBO : false
  NEED_SAFE_DTBO : false
  ROM_TEXT : "rom_android"

  PYTHON_VERSION: "3"
  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "false"
  KERNELSU_METHOD: "shell"

  PATCHES_SOURCE: "Kiz9178/NonGKI_Kernel_Build_2nd"
  PATCHES_BRANCH: "sample"
  SUSFS_FOLDER_FIXED: "Patches/Patch"
  SUSFS_PATCH_FIXED: "susfs_patch_to_4.19"

  REKERNEL_ENABLE: "false"
  HOOK_METHOD: "syscall"
  HOOK_OLDER: "false"
  KERNEL_PATCH: "false"

  KPM_ENABLE: "true"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://github.com/SukiSU-Ultra/SukiSU_KernelPatch_patch/releases/download/0.13.0/patch_linux"

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"
  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "true"
  SKIP_PATCH: "false"
  BUILD_OTHER_CONFIG: "false"
  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Build Redmi K30 Picasso (MIUI 13 A12)
    runs-on: ubuntu-22.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      # ============================================================
      # 核心修复：在打补丁和编译前，彻底清理内核源码根目录
      # ============================================================
      - name: 🧹 ULTIMATE CLEAN (Fix mrproper error)
        run: |
          echo "============================================="
          echo "Starting ULTIMATE CLEAN on kernel source root"
          echo "============================================="
          
          # 关键：确保在源码根目录操作
          cd $GITHUB_WORKSPACE/device_kernel
          echo "Current directory: $(pwd)"
          
          # 1. 删除整个 out 编译目录
          rm -rf out
          
          # 2. 删除所有编译生成的文件和配置
          rm -f .config .config.old .version Module.symvers System.map
          
          # 3. 删除所有 .o .ko .cmd .mod 等中间文件
          find . -type f \( -name "*.o" -o -name "*.ko" -o -name "*.cmd" -o -name "*.mod.c" -o -name "*.mod" \) -delete 2>/dev/null || true
          
          # 4. 删除所有临时文件
          find . -type f -name ".*.cmd" -delete 2>/dev/null || true
          find . -type f -name "*.tmp" -delete 2>/dev/null || true
          find . -type f -name "*.swp" -delete 2>/dev/null || true
          
          # 5. 删除自动生成的头文件目录
          rm -rf include/generated
          rm -rf include/config
          
          # 6. 删除 scripts 编译产物
          rm -rf scripts/basic
          rm -rf scripts/dtc
          
          # 7. 最后，在根目录执行一次 make mrproper（确保环境干净）
          make mrproper 2>/dev/null || echo "make mrproper not critical"
          
          echo "============================================="
          echo "✅ ULTIMATE CLEAN completed"
          ls -la
          echo "============================================="

      - name: 🔧 Fix compat_uptr_t and header issues
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          
          # 修复 types.h - 添加 compat_uptr_t 定义
          if ! grep -q "compat_uptr_t" include/linux/types.h; then
            sed -i '/typedef u32 __kernel_dev_t;/a \
            \
            /* Fix for compat_uptr_t missing */\
            #ifndef compat_uptr_t\
            #ifdef CONFIG_COMPAT\
            typedef u32 compat_uptr_t;\
            #else\
            typedef unsigned long compat_uptr_t;\
            #endif\
            #endif' include/linux/types.h
          fi
          
          # 修复 filter.h
          if grep -q "compat_uptr_t" include/linux/filter.h; then
            sed -i '1i #ifndef compat_uptr_t\ntypedef u32 compat_uptr_t;\n#endif\n' include/linux/filter.h
          fi
          
          # 修复 millet.h（如果存在）
          if [ -f "include/linux/millet.h" ]; then
            sed -i 's/static const char \*NAME_ARRAY/static const char *NAME_ARRAY __maybe_unused/' include/linux/millet.h
          fi
          
          echo "✅ compat_uptr_t fix applied"

      - name: 🔧 Fix VDSO32 and config
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          
          # 确保 CONFIG_COMPAT 启用
          if [ -f "scripts/config" ]; then
            scripts/config --enable CONFIG_COMPAT
            scripts/config --enable CONFIG_COMPAT_32BIT_TIME
            scripts/config --disable CONFIG_COMPAT_VDSO
          fi
          
          # 写入 defconfig
          echo "CONFIG_COMPAT=y" >> arch/arm64/configs/vendor/xiaomi/picasso.config
          echo "CONFIG_COMPAT_32BIT_TIME=y" >> arch/arm64/configs/vendor/xiaomi/picasso.config
          echo "# CONFIG_COMPAT_VDSO is not set" >> arch/arm64/configs/vendor/xiaomi/picasso.config
          
          echo "✅ VDSO32 disabled and COMPAT enabled"

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🪛 Extra Kernel Options
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          # 确保配置生效
          if [ -f "scripts/config" ]; then
            scripts/config --enable CONFIG_KPROBES
            scripts/config --enable CONFIG_HAVE_KPROBES
          fi

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🔧 Patch Hide Stuff
        uses: ./.github/workflows/patch-hide-stuff

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
